#splash{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:440px;border:2px solid var(--g);border-radius:34px;padding:34px 22px;background:rgba(11,12,11,.92);box-shadow:0 0 50px rgba(255,59,59,.15);text-align:center}
.box h2{color:var(--w);font-size:22px;margin:0 0 26px;text-shadow:0 0 14px rgba(255,59,59,.5)}
.pill{display:block;width:100%;padding:18px;margin-top:14px;border:2px solid var(--g);border-radius:26px;background:linear-gradient(135deg,#4a1212,#160a0a);color:var(--w);font-size:18px;font-weight:700;cursor:pointer;text-align:center}
#app{display:none;max-width:520px;margin:0 auto;padding:14px}
.welcome{border:1px solid var(--gd);border-inline:4px solid var(--g);border-radius:26px;padding:18px;line-height:1.9;text-align:center;font-size:15px;background:rgba(11,12,11,.9);margin-bottom:14px}
.panel{border:2px solid var(--gd);border-radius:34px;padding:18px;background:rgba(11,12,11,.9);box-shadow:0 0 40px rgba(255,59,59,.07)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.top h1{margin:0;font-size:24px;color:var(--w);text-shadow:0 0 14px rgba(255,59,59,.9);letter-spacing:1px}
.top .pill{width:auto;margin:0;padding:12px 16px;font-size:15px;border-radius:30px;white-space:nowrap}
.inp{width:100%;padding:18px;border:2px solid var(--gd);border-radius:24px;background:#050504;color:var(--tx);font-size:22px;outline:none}
.inp:focus{border-color:var(--g)}
.tgs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}
.tg{grid-column:span 2;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 8px;border:2px solid var(--gd);border-radius:22px;background:linear-gradient(135deg,#1d0c0c,#0c0909);cursor:pointer;user-select:none;font-weight:700;font-size:15px;text-align:center}
.tg.w{grid-column:span 3}
.tg i{flex:none;width:26px;height:26px;border-radius:50%;border:3px solid var(--g);background:#050504}
.tg.on i{background:radial-gradient(circle,#fff 38%,var(--g) 42%);box-shadow:0 0 14px var(--g)}
.tg.on{color:var(--w)}
.tg.on{border-color:var(--g)}
select.sel{width:100%;margin-top:12px;padding:20px 44px;border:2px solid var(--gd);border-radius:26px;background:linear-gradient(135deg,#4a1212,#160a0a);color:var(--w);font-size:19px;font-weight:700;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;outline:none;
background-image:linear-gradient(135deg,#4a1212,#160a0a)}
.sw{position:relative}
.sw::after{content:"▼";position:absolute;top:50%;inset-inline-end:20px;transform:translateY(-35%);color:var(--w);pointer-events:none}
.sw select option{background:#160a0a;color:var(--tx)}
.cols{display:flex;gap:10px;margin:16px 0 4px}
.cols div{flex:1;text-align:center;color:var(--mut);font-size:15px}
.cols input{width:100%;height:84px;margin-top:8px;border:3px solid var(--gd);border-radius:22px;background:none;padding:0;overflow:hidden}
.cols input::-webkit-color-swatch-wrapper{padding:0}.cols input::-webkit-color-swatch{border:0;border-radius:18px}
.sl{margin-top:10px;border:2px solid var(--gd);border-radius:22px;padding:12px;max-height:230px;overflow:auto;display:none}
.sl h4{margin:0 0 8px;color:var(--w);font-size:14px}
.sl .r{display:flex;align-items:center;gap:10px;direction:ltr;margin:6px 0}
.sl .r b{width:30px;text-align:center;font-size:18px}
.sl input{flex:1;accent-color:#ff3b3b}
.pv{margin-top:18px;border:2px solid var(--gd);border-radius:26px;background:#000;min-height:110px;display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:auto;direction:ltr}
.pv>div{white-space:nowrap;font-size:40px;line-height:1.5}
.l{display:inline-block;border-bottom:5px solid}
.l span{display:inline-block;white-space:pre}
#out{margin-top:14px;border:2px dashed var(--g);border-radius:26px;padding:20px 16px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:19px;white-space:nowrap;overflow-x:auto;cursor:pointer;background:#050504}
.hint{text-align:center;color:var(--mut);margin-top:12px;font-size:15px}
#toast{position:fixed;inset-inline:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);max-width:380px;margin:auto;background:#fff;color:#b01010;font-weight:700;text-align:center;padding:14px;border-radius:20px;opacity:0;transform:translateY(20px);transition:.25s;pointer-events:none;z-index:30}
#toast.s{opacity:1;transform:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
#modal .box{max-height:80vh;overflow:auto;text-align:start}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mh h2{margin:0;font-size:18px}
.x{background:none;border:0;color:var(--w);font-size:26px;cursor:pointer}
.h{display:flex;align-items:center;gap:10px;border:2px solid var(--gd);border-radius:20px;padding:10px 14px;margin-bottom:10px}
.h .n{flex:1;direction:ltr;font-size:22px;overflow:hidden;white-space:nowrap;cursor:pointer;text-align:left}
.h .x{font-size:20px}
.emp{text-align:center;color:var(--mut);padding:14px}
</style>
</head>
<body>
<div id="splash"><div class="box"><h2>Select Language / اختر اللغة</h2>
<button class="pill" onclick="setLang('ar')">العربية 🇩🇿</button>
<button class="pill" onclick="setLang('en')">English 🇺🇸</button></div></div>

<div id="app">
<div style="text-align:center;margin-bottom:14px"><a class="pill" id="tg" target="_blank" rel="noopener" style="display:inline-block;width:auto;margin:0;padding:14px 30px;text-decoration:none" href="#">✨ <span data-i="join"></span></a></div>
<div class="welcome" data-i="welcome"></div>
<div class="panel">
<div class="top"><h1 data-i="title"></h1><button class="pill" id="hb">📋 <span data-i="saved"></span></button></div>
<input class="inp" id="name" value="Ripou" autocomplete="off" spellcheck="false">
<div class="tgs">
<div class="tg" data-t="b"><i></i><span data-i="b"></span></div>
<div class="tg" data-t="i"><i></i><span data-i="i"></span></div>
<div class="tg" data-t="u"><i></i><span data-i="u"></span></div>
<div class="tg w" data-t="s"><i></i><span data-i="s"></span></div>
<div class="tg w" data-t="c"><i></i><span data-i="c"></span></div>
</div>
<div class="sw"><select class="sel" id="mode"></select></div>
<div class="cols" id="cols">
<div><span data-i="c1"></span><input type="color" id="k1" value="#ff3b3b"></div>
<div><span data-i="c2"></span><input type="color" id="k2" value="#ffffff"></div>
<div><span data-i="c3"></span><input type="color" id="k3" value="#ff3b3b"></div>
<div><span data-i="c4"></span><input type="color" id="k4" value="#ff3b3b"></div>
</div>
<div class="sw"><select class="sel" id="height"></select></div>
<div class="sl" id="hs"><h4 data-i="hadj"></h4><div id="hl"></div></div>
<div class="sw"><select class="sel" id="size"></select></div>
<div class="sl" id="ss"><h4 data-i="sadj"></h4><div id="sl"></div></div>
<div class="pv"><div id="pv"></div></div>
<div id="out"></div>
<div class="hint" data-i="hint"></div>
<button class="pill" id="sv" style="margin-top:14px">💾 <span data-i="save"></span></button>
</div>
</div>

<div id="modal"><div class="box"><div class="mh"><h2 data-i="hist"></h2><button class="x" id="mx">×</button></div><div id="hl2"></div><button class="pill" id="clr" data-i="clear"></button></div></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const T={
ar:{title:"إستيديو Ripou",saved:"المحفوظة",join:"إنضم للقناة",welcome:"أهلا بيك! هذا الموقع يعاونك تصنع اسم ملون للعبة Car Parking.<br>كي تكمّل، اضغط على الكود اللي تحت الاسم باش تنسخو، وحطو في اللعبة، ويظهر اسمك كيما صمّمتو في المعاينة هنا.",
b:"عريض [B]",i:"مائل [I]",u:"تحته خط [U]",s:"مشطوب [S]",c:"إظهار ألوان الاسم في قائمة الأصدقاء [C]",c1:"اللون 1",c2:"اللون 2",c3:"اللون 3",c4:"اللون 4",
hadj:"ضبط الارتفاع",sadj:"ضبط الحجم",hint:"اضغط على المربع باش تنسخ الكود",save:"حفظ الاسم",hist:"الأسماء المحفوظة",clear:"مسح الكل",empty:"ما كاين حتى اسم محفوظ",copied:"✅ تم نسخ الكود",done:"💾 تم حفظ الاسم",
modes:["لون واحد","تدرج (لونين)","تدرج (3 ألوان)","تدرج (4 ألوان)","قوس قزح (تلقائي)","ألوان عشوائية","تبادل (لونين)","لون لكل حرف","لون لكل كلمة"],
heights:["الارتفاع: مستوي","الارتفاع: صعود سلس","الارتفاع: نزول سلس","الارتفاع: موجة","الارتفاع: قفزة حادة","الارتفاع: سلايدرات مخصصة"],
sizes:["الحجم: حروف عادية","الحجم: الكل صغير","الحجم: تبادل حاد","الحجم: سلايدرات مخصصة"]},
en:{title:"Ripou CPM Studio",saved:"Saved",join:"Join Channel",welcome:"Welcome! This website helps you create a colored name for the game Car Parking.<br>When you finish, tap the code under the name to copy it, then paste it in the game, and your name will appear as designed in the preview here.",
b:"Bold [B]",i:"Italic [I]",u:"Underline [U]",s:"Strike [S]",c:"Show name colors in friends list [C]",c1:"Color 1",c2:"Color 2",c3:"Color 3",c4:"Color 4",
hadj:"Height Adjustment",sadj:"Size Adjustment",hint:"Click the box above to copy code",save:"Save name",hist:"Saved Names History",clear:"Clear All",empty:"No saved names yet",copied:"✅ Code copied",done:"💾 Name saved",
modes:["Color (One)","Gradient (2 Colors)","Gradient (3 Colors)","Gradient (4 Colors)","Rainbow (Auto)","Random Colors","Alternating (2 Colors)","Color Each Letter","Color Each Word"],
heights:["Height: Center Aligned","Height: Smooth Rise","Height: Smooth Fall","Height: Wave","Height: Sharp Jump","Height: Custom Sliders"],
sizes:["Size: Normal Letters","Size: All Small","Size: Sharp Alternate","Size: Custom Sliders"]}};
const MK=["one","g2","g3","g4","rainbow","random","alt","letter","word"],HK=["center","rise","fall","wave","jump","custom"],SK=["normal","small","alt","custom"];
const need={one:1,g2:2,g3:3,g4:4,alt:2,letter:4,word:4,rainbow:0,random:0};
const TG_URL="https://t.me/RIPOU0209";
let L="ar",hArr=[],sArr=[],hist=[];const tags=new Set();
try{hist=JSON.parse(localStorage.getItem("rp_h")||"[]")}catch(e){}
const hex=v=>Math.round(v).toString(16).padStart(2,"0");
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const x=rgb(a),y=rgb(b);return"#"+x.map((v,i)=>hex(v+(y[i]-v)*t)).join("")};
const hsl=h=>{const f=n=>{const k=(n+h/30)%12;return Math.round(255*(.5-.5*Math.max(-1,Math.min(k-3,9-k,1))))};return"#"+[f(0),f(8),f(4)].map(hex).join("")};
const K=()=>[1,2,3,4].map(i=>$("k"+i).value);
function grad(l,t){if(l.length==1)return l[0];const p=t*(l.length-1),i=Math.min(Math.floor(p),l.length-2);return mix(l[i],l[i+1],p-i)}
function fill(id,names,keys){const s=$(id),v=s.value;s.innerHTML="";names.forEach((n,i)=>{const o=document.createElement("option");o.value=keys[i];o.textContent=n;s.appendChild(o)});if(v)s.value=v}
function setLang(l){L=l;const d=document.documentElement;d.lang=l;d.dir=l=="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>{e.innerHTML=T[l][e.dataset.i]});
  fill("mode",T[l].modes,MK);fill("height",T[l].heights,HK);fill("size",T[l].sizes,SK);
  if(!$("mode").value)$("mode").value="g3";
  $("tg").href=TG_URL;$("splash").style.display="none";$("app").style.display="block";updUI();render();drawHist()}
function build(){
  const ch=Array.from($("name").value),n=ch.length,m=$("mode").value,c=K(),h=$("height").value,z=$("size").value;let wi=0;
  return ch.map((x,i)=>{
    const t=n>1?i/(n-1):0;let col;
    if(m=="one")col=c[0];else if(m[0]=="g")col=grad(c.slice(0,+m[1]),t);
    else if(m=="rainbow")col=hsl(t*300);else if(m=="random")col=hsl(Math.random()*360);
    else if(m=="alt")col=c[i%2];else if(m=="letter")col=c[i%4];else{col=c[wi%4];if(x==" ")wi++}
    let p=0;
    if(h=="rise")p=t<.34?-1:t<.67?0:1;else if(h=="fall")p=t<.34?1:t<.67?0:-1;
    else if(h=="wave")p=[1,0,-1,0][i%4];else if(h=="jump")p=i%2?-1:1;else if(h=="custom")p=+hArr[i]||0;
    let sm=z=="small"?1:z=="alt"?i%2:z=="custom"?(+sArr[i]||0):0;
    if(!p&&sm)p=-1;
    return{ch:x,col:col.toUpperCase(),p};
  });
}
function mk(r,box){box.innerHTML="";r.forEach(o=>{const l=document.createElement("span");l.className="l";l.style.borderColor=o.col;
  const s=document.createElement("span");s.textContent=o.ch;s.style.color=o.col;
  if(o.p){s.style.fontSize="65%";s.style.transform="translateY("+(o.p>0?"-.4em":".25em")+")"}
  l.appendChild(s);box.appendChild(l)})}
function codeOf(r){let pre="";["b","i","c","u","s"].forEach(t=>{if(tags.has(t))pre+="["+t.toUpperCase()+"]"});
  return pre+r.map(o=>o.ch==" "?" ":"["+o.col.slice(1)+"]"+(o.p?(o.p>0?"[sup]"+o.ch+"[/sup]":"[sub]"+o.ch+"[/sub]"):o.ch)).join("")}
function render(){const r=build();mk(r,$("pv"));
  const p=$("pv");p.style.fontWeight=tags.has("b")?"700":"400";p.style.fontStyle=tags.has("i")?"italic":"normal";
  p.style.textDecoration=[tags.has("u")&&"underline",tags.has("s")&&"line-through"].filter(Boolean).join(" ")||"none";
  $("out").textContent=codeOf(r)}
function sliders(box,arr,min,max,n){box.innerHTML="";Array.from($("name").value).forEach((c,i)=>{
  const r=document.createElement("div");r.className="r";const b=document.createElement("b");b.textContent=c;
  const s=document.createElement("input");s.type="range";s.min=min;s.max=max;s.step=1;s.value=arr[i]||0;
  s.oninput=()=>{arr[i]=+s.value;render()};r.append(b,s);box.appendChild(r)})}
function updUI(){const k=need[$("mode").value];document.querySelectorAll(".cols div").forEach((d,i)=>d.style.display=i<k?"block":"none");$("cols").style.display=k?"flex":"none";
  const hc=$("height").value=="custom",sc=$("size").value=="custom";$("hs").style.display=hc?"block":"none";$("ss").style.display=sc?"block":"none";
  if(hc)sliders($("hl"),hArr,-1,1);if(sc)sliders($("sl"),sArr,0,1)}
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("s");setTimeout(()=>e.classList.remove("s"),1800)};
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast(T[L].copied)}
document.querySelectorAll(".tg").forEach(e=>e.onclick=()=>{const t=e.dataset.t;tags.has(t)?tags.delete(t):tags.add(t);e.classList.toggle("on");render()});
$("name").oninput=()=>{updUI();render()};
["mode","height","size"].forEach(id=>$(id).onchange=()=>{updUI();render()});
[1,2,3,4].forEach(i=>$("k"+i).oninput=render);
$("out").onclick=()=>copy($("out").textContent);
function persist(){try{localStorage.setItem("rp_h",JSON.stringify(hist))}catch(e){}}
$("sv").onclick=()=>{hist.unshift({r:build(),code:$("out").textContent});hist=hist.slice(0,30);persist();drawHist();toast(T[L].done)};
function drawHist(){const b=$("hl2");b.innerHTML="";if(!hist.length){b.innerHTML='<div class="emp">'+T[L].empty+'</div>';return}
  hist.forEach((h,i)=>{const d=document.createElement("div");d.className="h";const n=document.createElement("div");n.className="n";mk(h.r,n);n.onclick=()=>copy(h.code);
    const x=document.createElement("button");x.className="x";x.textContent="×";x.onclick=()=>{hist.splice(i,1);persist();drawHist()};d.append(n,x);b.appendChild(d)})}
$("hb").onclick=()=>{$("modal").style.display="flex"};$("mx").onclick=()=>{$("modal").style.display="none"};
$("clr").onclick=()=>{hist=[];persist();drawHist()};
</script>
</body>
</html>
