h1{font-size:22px;color:var(--gold);text-align:center;margin:8px 0 16px}
.card{backdrop-filter:blur(3px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input[type=text],select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{flex:1;min-width:48px;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;user-select:none;background:#fff}
.chip.on{background:var(--gold);color:#fff;font-weight:700}
.colors{display:flex;gap:10px;margin-top:10px}
.colors input{flex:1;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:2px}
#preview{min-height:70px;display:flex;align-items:center;justify-content:center;font-size:34px;background:#111;border-radius:10px;padding:12px;direction:ltr;flex-wrap:wrap}
#preview span{display:inline-block;white-space:pre}
#out{width:100%;min-height:90px;direction:ltr;text-align:left;padding:12px;border-radius:10px;border:1px dashed var(--gold);background:#fff;color:var(--text);font-family:monospace;font-size:13px;resize:vertical}
button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#a81c1c,#6e0f0f);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.hint{font-size:12px;color:var(--mut);margin-top:8px;text-align:center}
</style>

<body>
<h1 style="direction:ltr;letter-spacing:1px">Ripou0209</h1>

<div class="card">
<label>اكتب اسمك</label>
<input type="text" id="name" value="اسمك هنا" autocomplete="off">
</div>

<div class="card">
<label>نمط الألوان</label>
<select id="mode">
<option value="one">لون واحد</option>
<option value="g2" selected>تدرج (لونين)</option>
<option value="g3">تدرج (3 ألوان)</option>
<option value="g4">تدرج (4 ألوان)</option>
<option value="rainbow">قوس قزح</option>
<option value="random">ألوان عشوائية</option>
<option value="alt">تبادل (لونين)</option>
<option value="letter">لون لكل حرف</option>
<option value="word">لون لكل كلمة</option>
</select>
<div class="colors" id="cols">
<input type="color" id="c1" value="#c62828">
<input type="color" id="c2" value="#b9bcc2">
<input type="color" id="c3" value="#3dd6ff">
<input type="color" id="c4" value="#7dff6a">
</div>
</div>

<div class="card">
<label>التنسيق</label>
<div class="row" id="styles">
<div class="chip" data-t="b"><b>B</b></div>
<div class="chip" data-t="i"><i>I</i></div>
<div class="chip" data-t="u"><u>U</u></div>
<div class="chip" data-t="s"><s>S</s></div>
</div>
<br>
<label>الارتفاع</label>
<select id="height">
<option value="center">مستوي</option>
<option value="rise">صعود تدريجي</option>
<option value="fall">نزول تدريجي</option>
<option value="wave">موجة</option>
<option value="jump">قفزات</option>
</select>
<br><br>
<label>الحجم</label>
<select id="size">
<option value="normal">عادي</option>
<option value="small">كله صغير</option>
<option value="alt">متبادل</option>
</select>
</div>

<div class="card">
<label>المعاينة</label>
<div id="preview"></div>
<br>
<label>الكود</label>
<textarea id="out" readonly></textarea>
<button id="copy">📋 نسخ الكود</button>
<div class="hint" id="msg">انسخ الكود والصقه في اسم اللعبة. جرّب أولاً لأن بعض الإصدارات قد تختلف.</div>
</div>

<script>
const $=id=>document.getElementById(id);
const tags=new Set();
const hex=v=>Math.round(v).toString(16).padStart(2,"0");
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const x=rgb(a),y=rgb(b);return"#"+x.map((v,i)=>hex(v+(y[i]-v)*t)).join("")};
const hsl=(h)=>{const f=n=>{const k=(n+h/30)%12;return Math.round(255*(.5-.5*Math.max(-1,Math.min(k-3,9-k,1))))};return"#"+[f(0),f(8),f(4)].map(v=>hex(v)).join("")};
function stops(n){const c=[$("c1").value,$("c2").value,$("c3").value,$("c4").value];return c.slice(0,n)}
function grad(list,t){if(list.length==1)return list[0];const p=t*(list.length-1),i=Math.min(Math.floor(p),list.length-2);return mix(list[i],list[i+1],p-i)}
function build(){
  const chars=Array.from($("name").value),n=chars.length,mode=$("mode").value;
  const C=[$("c1").value,$("c2").value,$("c3").value,$("c4").value];
  let wi=0,res=[];
  chars.forEach((ch,i)=>{
    const t=n>1?i/(n-1):0;let col;
    if(mode=="one")col=C[0];
    else if(mode[0]=="g")col=grad(stops(+mode[1]),t);
    else if(mode=="rainbow")col=hsl(t*300);
    else if(mode=="random")col=hsl(Math.random()*360);
    else if(mode=="alt")col=C[i%2];
    else if(mode=="letter")col=C[i%4];
    else{col=C[wi%4];if(ch==" ")wi++}
    const h=$("height").value;let off=0;
    if(h=="rise")off=t*.6-.3;else if(h=="fall")off=.3-t*.6;else if(h=="wave")off=Math.sin(i*1.1)*.3;else if(h=="jump")off=i%2?.3:-.3;
    const s=$("size").value;let sz=100;
    if(s=="small")sz=70;else if(s=="alt")sz=i%2?70:100;
    res.push({ch,col,off:+off.toFixed(2),sz});
  });
  return res;
}
function render(){
  const r=build(),pv=$("preview");pv.innerHTML="";
  let code="";
  r.forEach(o=>{
    const sp=document.createElement("span");sp.textContent=o.ch;
    sp.style.color=o.col;sp.style.fontSize=o.sz+"%";
    sp.style.transform="translateY("+(-o.off)+"em)";
    sp.style.fontWeight=tags.has("b")?"700":"400";
    sp.style.fontStyle=tags.has("i")?"italic":"normal";
    sp.style.textDecoration=[tags.has("u")&&"underline",tags.has("s")&&"line-through"].filter(Boolean).join(" ")||"none";
    pv.appendChild(sp);
    if(o.ch==" "){code+=" ";return}
    let p="<color="+o.col+">";
    if(o.off)p+="<voffset="+o.off+"em>";
    if(o.sz!=100)p+="<size="+o.sz+"%>";
    let q=o.ch;
    if(o.sz!=100)q+="</size>";
    if(o.off)q+="</voffset>";
    code+=p+q+"</color>";
  });
  let open="",close="";
  ["b","i","u","s"].forEach(t=>{if(tags.has(t)){open+="<"+t+">";close="</"+t+">"+close}});
  $("out").value=open+code+close;
}
document.querySelectorAll("#styles .chip").forEach(c=>c.onclick=()=>{
  const t=c.dataset.t;tags.has(t)?tags.delete(t):tags.add(t);c.classList.toggle("on");render()});
["name","mode","height","size","c1","c2","c3","c4"].forEach(id=>$(id).addEventListener("input",render));
$("mode").addEventListener("change",()=>{$("cols").style.display=$("mode").value=="rainbow"||$("mode").value=="random"?"none":"flex"});
$("copy").onclick=async()=>{
  try{await navigator.clipboard.writeText($("out").value)}catch(e){$("out").select();document.execCommand("copy")}
  $("msg").textContent="✅ تم النسخ";setTimeout(()=>$("msg").textContent="انسخ الكود والصقه في اسم اللعبة. جرّب أولاً لأن بعض الإصدارات قد تختلف.",2000)};
render();
</script>
</body>
</html>
